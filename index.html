<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiTai Web</title>
    
    <!-- PeerJS & Firebase SDKs -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111b21;
            color: #e9edef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            background: #111b21;
            position: relative;
        }

        /* --- AUTH & PROFILE OVERLAYS --- */
        .overlay {
            position: absolute;
            inset: 0;
            background: #111b21;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .card {
            background: #202c33;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .card h2 { color: #00a884; text-align: center; }

        input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #2a3942;
            background: #2a3942;
            color: #e9edef;
            outline: none;
            font-size: 14px;
        }

        .btn-green {
            background: #00a884;
            color: #111b21;
            font-weight: bold;
            border: none;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-green:hover { background: #008f6f; }

        .btn-google {
            background: #ffffff;
            color: #111b21;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .toggle-link {
            font-size: 13px;
            color: #8696a0;
            text-align: center;
            cursor: pointer;
        }
        .toggle-link span { color: #00a884; }

        .hidden { display: none !important; }

        /* --- SIDEBAR PANEL --- */
        .sidebar {
            width: 380px;
            background: #111b21;
            border-right: 1px solid #222d34;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 60px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #111b21;
            font-size: 16px;
        }

        .user-meta { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 14px; color: #e9edef; }
        .user-tag { font-size: 12px; color: #8696a0; }

        .logout-icon {
            background: transparent;
            border: none;
            color: #8696a0;
            font-size: 18px;
            cursor: pointer;
        }

        .social-stats {
            display: flex;
            justify-content: space-around;
            background: #182229;
            padding: 10px;
            border-bottom: 1px solid #222d34;
            text-align: center;
        }
        .stat-item { font-size: 12px; color: #8696a0; }
        .stat-item strong { display: block; color: #00a884; font-size: 14px; }

        .search-box {
            padding: 10px 16px;
            background: #111b21;
            border-bottom: 1px solid #222d34;
        }

        .results-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .user-card {
            padding: 12px 16px;
            border-bottom: 1px solid #222d34;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-card:hover { background: #202c33; }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-follow { background: #3b82f6; color: white; }
        .btn-friend { background: #10b981; color: white; }
        .btn-disabled { background: #334155; color: #94a3b8; cursor: default; }

        /* --- MAIN CHAT PANEL --- */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
            position: relative;
        }

        .chat-wallpaper {
            position: absolute;
            inset: 0;
            opacity: 0.06;
            background-image: radial-gradient(#8696a0 1px, transparent 0);
            background-size: 16px 16px;
            pointer-events: none;
        }

        .chat-header {
            height: 60px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 2;
            border-bottom: 1px solid #222d34;
        }

        .messages-container {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .msg-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            word-wrap: break-word;
        }

        .msg-bubble.mine { align-self: flex-end; background: #005c4b; color: #e9edef; }
        .msg-bubble.other { align-self: flex-start; background: #202c33; color: #e9edef; }
        .msg-bubble.system { align-self: center; background: #182229; color: #8696a0; font-size: 12px; }

        .chat-footer {
            height: 62px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .chat-footer input { flex: 1; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Auth Screen -->
    <div id="auth-screen" class="overlay">
        <div class="card">
            <h2>TaiTai Web</h2>
            <button class="btn-google" onclick="handleGoogleAuth()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Continue with Google
            </button>
            <div style="text-align: center; color: #8696a0; font-size: 12px;">OR</div>
            <input type="email" id="auth-email" placeholder="Email Address">
            <input type="password" id="auth-password" placeholder="Password">
            <button class="btn-green" id="auth-btn" onclick="handleAuth()">Log In</button>
            <p class="toggle-link" id="auth-toggle" onclick="toggleAuthMode()">
                Need an account? <span>Register</span>
            </p>
        </div>
    </div>

    <!-- Setup Profile Screen (Shown on First Login) -->
    <div id="profile-setup-screen" class="overlay hidden">
        <div class="card">
            <h2>Create Your Profile</h2>
            <input type="text" id="setup-name" placeholder="Full Name">
            <input type="text" id="setup-username" placeholder="Choose Unique Username (e.g. dhaval6006)">
            <button class="btn-green" onclick="saveProfile()">Save & Continue</button>
        </div>
    </div>

    <!-- Sidebar Panel -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="user-profile">
                <div class="avatar" id="user-avatar">?</div>
                <div class="user-meta">
                    <div class="user-name" id="user-display">Loading...</div>
                    <div class="user-tag" id="user-username">@username</div>
                </div>
            </div>
            <button class="logout-icon" onclick="logout()" title="Logout">✕</button>
        </div>

        <div class="social-stats">
            <div class="stat-item"><strong id="stat-friends">0</strong> Friends</div>
            <div class="stat-item"><strong id="stat-followers">0</strong> Followers</div>
            <div class="stat-item"><strong id="stat-following">0</strong> Following</div>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search people by username..." oninput="searchUsers()">
        </div>

        <div class="results-list" id="user-results">
            <!-- Dynamically populated search results -->
        </div>
    </div>

    <!-- Main Chat Panel -->
    <div class="main-chat">
        <div class="chat-wallpaper"></div>

        <div class="chat-header">
            <div class="avatar" id="active-chat-avatar">#</div>
            <div>
                <h3 id="active-chat-name" style="font-size: 16px;">No Active Chat</h3>
                <span id="active-chat-status" style="font-size: 12px; color: #8696a0;">Select a friend from the left sidebar</span>
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <div class="msg-bubble system">Search for friends on the left panel to start chatting directly.</div>
        </div>

        <div class="chat-footer">
            <input type="text" id="message-input" placeholder="Type a message" disabled onkeypress="handleKey(event)">
            <button class="btn-green" id="send-btn" onclick="sendMessage()" disabled style="border-radius: 50%; width: 42px; height: 42px; padding: 0;">➔</button>
        </div>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDvcHF2aDJIP8BTZa2fm1fiNJPY1xFHwac",
        authDomain: "taitai-e7a12.firebaseapp.com",
        projectId: "taitai-e7a12",
        storageBucket: "taitai-e7a12.firebasestorage.app",
        messagingSenderId: "751701740383",
        appId: "1:751701740383:web:7e711f992fa266162844ea",
        measurementId: "G-1BXXCJ9EDT"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userProfile = null;
    let isRegistering = false;
    let peer = null;
    let activeConnection = null;

    // --- AUTHENTICATION & PROFILE FLOW ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-screen').classList.add('hidden');
            
            // Fetch User Profile from Firestore
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                userProfile = doc.data();
                loadUserProfileUI();
                initPeer();
            } else {
                document.getElementById('profile-setup-screen').classList.remove('hidden');
            }
        } else {
            currentUser = null;
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    });

    async function saveProfile() {
        const name = document.getElementById('setup-name').value.trim();
        const username = document.getElementById('setup-username').value.trim().toLowerCase();

        if (!name || !username) return alert("Please fill in all fields!");

        // Check if username is taken
        const query = await db.collection('users').where('username', '==', username).get();
        if (!query.empty) return alert("Username already taken! Choose another.");

        userProfile = {
            uid: currentUser.uid,
            name: name,
            username: username,
            email: currentUser.email,
            friends: [],
            followers: [],
            following: []
        };

        await db.collection('users').doc(currentUser.uid).set(userProfile);
        document.getElementById('profile-setup-screen').classList.add('hidden');
        loadUserProfileUI();
        initPeer();
    }

    function loadUserProfileUI() {
        document.getElementById('user-display').innerText = userProfile.name;
        document.getElementById('user-username').innerText = `@${userProfile.username}`;
        document.getElementById('user-avatar').innerText = userProfile.name.charAt(0).toUpperCase();

        document.getElementById('stat-friends').innerText = (userProfile.friends || []).length;
        document.getElementById('stat-followers').innerText = (userProfile.followers || []).length;
        document.getElementById('stat-following').innerText = (userProfile.following || []).length;

        searchUsers(); // Pre-load friends/users list
    }

    // --- SEARCH & SOCIAL LOGIC ---
    async function searchUsers() {
        const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
        const container = document.getElementById('user-results');
        container.innerHTML = '';

        let snapshot;
        if (searchTerm) {
            snapshot = await db.collection('users').where('username', '>=', searchTerm).where('username', '<=', searchTerm + '\uf8ff').get();
        } else {
            snapshot = await db.collection('users').limit(15).get();
        }

        snapshot.forEach(doc => {
            const data = doc.data();
            if (data.uid === currentUser.uid) return; // Skip self

            const isFollowing = (userProfile.following || []).includes(data.uid);
            const isFriend = (userProfile.friends || []).includes(data.uid);

            const userCard = document.createElement('div');
            userCard.className = 'user-card';
            userCard.innerHTML = `
                <div class="user-profile">
                    <div class="avatar">${data.name.charAt(0).toUpperCase()}</div>
                    <div class="user-meta">
                        <div class="user-name">${escapeHTML(data.name)}</div>
                        <div class="user-tag">@${escapeHTML(data.username)}</div>
                    </div>
                </div>
                <div class="action-btns">
                    <button class="btn-small ${isFollowing ? 'btn-disabled' : 'btn-follow'}" onclick="toggleFollow('${data.uid}')">
                        ${isFollowing ? 'Following' : 'Follow'}
                    </button>
                    <button class="btn-small ${isFriend ? 'btn-friend' : 'btn-follow'}" onclick="handleFriend('${data.uid}', '${data.username}', '${data.name}')">
                        ${isFriend ? 'Chat' : 'Add Friend'}
                    </button>
                </div>
            `;
            container.appendChild(userCard);
        });
    }

    async function toggleFollow(targetUid) {
        let following = userProfile.following || [];
        if (following.includes(targetUid)) {
            following = following.filter(id => id !== targetUid);
            await db.collection('users').doc(targetUid).update({ followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
        } else {
            following.push(targetUid);
            await db.collection('users').doc(targetUid).update({ followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
        }
        
        userProfile.following = following;
        await db.collection('users').doc(currentUser.uid).update({ following: following });
        loadUserProfileUI();
    }

    async function handleFriend(targetUid, targetUsername, targetName) {
        let friends = userProfile.friends || [];
        if (!friends.includes(targetUid)) {
            friends.push(targetUid);
            userProfile.friends = friends;
            await db.collection('users').doc(currentUser.uid).update({ friends: friends });
            await db.collection('users').doc(targetUid).update({ friends: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
            loadUserProfileUI();
        }

        // Start PeerJS Chat Session
        startChatSession(targetUsername, targetName);
    }

    // --- P2P CHATTING LOGIC ---
    function initPeer() {
        const peerId = `taitai-user-${userProfile.username}`;
        peer = new Peer(peerId, { config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} });

        peer.on('connection', (conn) => {
            activeConnection = conn;
            setupChatListeners();
        });
    }

    function startChatSession(targetUsername, targetName) {
        document.getElementById('active-chat-name').innerText = targetName;
        document.getElementById('active-chat-status').innerText = `@${targetUsername}`;
        document.getElementById('active-chat-avatar').innerText = targetName.charAt(0).toUpperCase();

        const targetPeerId = `taitai-user-${targetUsername}`;
        activeConnection = peer.connect(targetPeerId);
        setupChatListeners();
    }

    function setupChatListeners() {
        document.getElementById('message-input').disabled = false;
        document.getElementById('send-btn').disabled = false;

        activeConnection.on('data', (data) => {
            if (data.type === 'chat') {
                appendMessage(data.sender, data.text, 'other');
            }
        });
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activeConnection) return;

        activeConnection.send({ type: 'chat', sender: userProfile.name, text: text });
        appendMessage('You', text, 'mine');
        input.value = '';
    }

    function appendMessage(sender, text, type) {
        const container = document.getElementById('messages-container');
        const msg = document.createElement('div');
        msg.className = `msg-bubble ${type}`;
        msg.innerHTML = `<span>${escapeHTML(text)}</span>`;
        container.appendChild(msg);
        container.scrollTop = container.scrollHeight;
    }

    // --- AUTH UTILS ---
    async function handleGoogleAuth() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try { await auth.signInWithPopup(provider); } catch (e) { alert(e.message); }
    }

    function toggleAuthMode() {
        isRegistering = !isRegistering;
        document.getElementById('auth-btn').innerText = isRegistering ? "Register" : "Log In";
    }

    async function handleAuth() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        try {
            if (isRegistering) await auth.createUserWithEmailAndPassword(email, password);
            else await auth.signInWithEmailAndPassword(email, password);
        } catch (e) { alert(e.message); }
    }

    function logout() {
        auth.signOut().then(() => { if (peer) peer.destroy(); location.reload(); });
    }

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
</script>
</body>
</html>
